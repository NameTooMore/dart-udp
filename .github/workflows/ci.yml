name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@main
      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: 缓存 Cargo
        uses: actions/cache@main
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: 运行 Rust 质量门禁
        run: ./scripts/ci.sh check

  compose-contract:
    name: Compose scenario contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@main
      - name: 校验全部 Compose 场景入口
        run: ./scripts/ci.sh compose-contract

  compose-smoke:
    name: Compose relay smoke test
    needs: [rust, compose-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@main
      - name: 运行 Compose 烟雾场景
        run: ./scripts/ci.sh compose
